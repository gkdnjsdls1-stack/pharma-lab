<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pharma-lab</title>
<style>
:root{--bg:#0a0c10;--panel:#13171e;--line:#262d38;--ink:#dfe7ef;--dim:#7d8795;
  --acc:#56b6c2;--ok:#59c46a;--bad:#e5534b;--warn:#d8a634;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{margin-bottom:10px}
h1{font-size:15px;margin:0 0 4px;letter-spacing:.06em;color:var(--dim);font-weight:600}
h1 a{color:var(--acc);text-decoration:none}
h1 a:hover{text-decoration:underline}
#vital{font-size:15px;font-weight:600}

/* --- 방 (3D) --- */
.room{position:relative;background:#070a0d;border:1px solid var(--line);
  border-radius:10px;overflow:hidden;height:min(56vh, 70vw);min-height:300px}
.room canvas{display:block;width:100%;height:100%;touch-action:none}
#hint3d{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--dim);
  pointer-events:none;opacity:.8}
#ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%);
  background:#1c222b;border:1px solid var(--warn);border-radius:7px;padding:4px 10px;
  font-family:var(--mono);font-size:12px;color:var(--warn);white-space:nowrap}
#ghost[hidden]{display:none}

/* --- 패널 --- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
h2{font-size:13px;margin:0 0 10px;color:var(--acc);letter-spacing:.04em}
.mono{font-family:var(--mono)}
button{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid var(--line);
  background:#1c222b;color:var(--ink);cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.35;cursor:not-allowed}
button.go{background:var(--acc);border-color:var(--acc);color:#06212a;font-weight:700}
input,select{font:inherit;font-family:var(--mono);padding:6px 9px;border-radius:7px;
  border:1px solid var(--line);background:#0c1015;color:var(--ink);width:86px}
select{width:auto}
label{font-size:12px;color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.note{font-size:12px;color:var(--dim);line-height:1.6}
.doc{background:#0c1015;border-left:2px solid var(--line);padding:9px 13px;margin:7px 0;
  font-size:13px;line-height:1.8}
.doc b{color:var(--ink)}
.paper{background:#161a14;border-left:2px solid #3f4a35;font-family:var(--mono);font-size:13px;
  padding:11px 14px;margin:7px 0;line-height:2;white-space:pre-wrap}
.blank{color:var(--warn);background:#2a2415;padding:0 7px;border-radius:3px}
.paper input{width:64px;padding:3px 7px;margin:0 2px}
.paper select{padding:3px 7px;margin:0 2px}
input[type=checkbox]{width:auto;vertical-align:-2px;margin:0 4px 0 0}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
.big{font-family:var(--mono);font-size:20px}
.vio{color:#a978d8;font-weight:600}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:600}
.zoom{background:#0c1015;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}

/* --- 대사 --- */
#vn{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;
  justify-content:center;background:linear-gradient(transparent 40%,#000a 100%);cursor:pointer}
#vn[hidden]{display:none}
.vnbox{width:min(960px,96vw);margin:0 10px 18px;background:#0e1319ef;
  border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:14px;
  align-items:flex-end;box-shadow:0 10px 40px #000a}
.vnpic{width:132px;flex:0 0 132px;height:168px;border-radius:9px;overflow:hidden;
  background:#0a0f14;border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center}
.vnpic img{width:100%;height:100%;object-fit:cover;object-position:top}
.vnpic .silhouette{width:72px;height:120px;opacity:.5}
.vnpic figcaption{position:absolute}
.vntext{flex:1;min-width:0;padding-bottom:4px}
.vnname{font-size:12px;color:var(--acc);letter-spacing:.05em;margin-bottom:6px;min-height:18px}
.vnline{font-size:16px;line-height:1.85;min-height:3.7em}
.vnnext{text-align:right;font-size:11px;color:var(--dim);margin-top:6px}
.vnmiss{font:10px var(--mono);color:#4b5563;text-align:center;padding:4px}
@media (max-width:560px){
  .vnpic{width:84px;flex:0 0 84px;height:108px}
  .vnline{font-size:15px}
}
/* 사물을 클릭하면 방 위로 띄운다. 아래 패널은 화면 밖이라 안 보였다. */
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  padding:20px;background:#000a}
#sheet[hidden]{display:none}
.sheetbox{position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px;width:min(620px,94vw);max-height:84vh;overflow:auto;
  box-shadow:0 20px 60px #000c}
#sheetclose{position:absolute;top:10px;right:12px;padding:2px 9px;font-size:13px;line-height:1.4}
.sheetbox h2{padding-right:34px}
/* 끌어다 놓은 결과는 창을 열지 않고 방 위에 한 줄로 알린다 */
#toast{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;pointer-events:none;
  background:#0e1319ee;border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:8px;padding:8px 12px;font-size:13px;color:var(--warn)}
#toast[hidden]{display:none}
#end{position:fixed;inset:0;z-index:60;background:#000d;display:flex;align-items:center;
  justify-content:center;padding:20px}
#end[hidden]{display:none}
#end .panel{max-width:540px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><a href="index.html" id="tohub">← 방 고르기</a>　<span id="roomname"></span></h1>
  <div id="vital"></div>
</header>

<div class="room" id="room">
  <div id="hint3d">끌어서 둘러보기 · 휠로 당기기 · 시약은 집어서 올려놓는다</div>
  <div id="toast" hidden></div>
</div>
</div>

<div id="sheet" hidden><div class="sheetbox" id="sheetbox"></div></div>

<div id="ghost" hidden></div>

<div id="vn" hidden>
  <div class="vnbox">
    <div class="vnpic">
      <img id="vnpic" alt="" hidden>
      <div id="vnfall">
        <svg class="silhouette" viewBox="0 0 72 120" aria-hidden="true">
          <circle cx="36" cy="28" r="18" fill="#2a3642"/>
          <path d="M8 120 Q10 62 36 56 Q62 62 64 120 Z" fill="#232e38"/>
        </svg>
        <div class="vnmiss" id="vnmiss"></div>
      </div>
    </div>
    <div class="vntext">
      <div class="vnname" id="vnname"></div>
      <div class="vnline" id="vnline"></div>
      <div class="vnnext">클릭 · Space · Enter 로 넘기기</div>
    </div>
  </div>
</div>

<div id="end" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 방마다 화학 파일과 방 파일이 하나씩. 순서대로 불러오고 마지막에 엔진을 올린다.
const ROOMS = {
  aspirin: ['chem.js', 'room-aspirin.js'],
  ors:     ['ors.js',  'room-ors.js'],
  quinine: ['quinine.js', 'room-quinine.js'],
  penicillin: ['penicillin.js', 'room-penicillin.js'],
  methanol:   ['methanol.js', 'room-methanol.js'],
  blood:      ['blood.js',    'room-blood.js'],
  bleach:     ['bleach.js',   'room-bleach.js'],
  ether:      ['ether.js',    'room-ether.js'],
};
const id = new URLSearchParams(location.search).get('r') || 'aspirin';
const files = (ROOMS[id] || ROOMS.aspirin).concat('engine.js');
(function load(i){
  if (i >= files.length) return;
  const s = document.createElement('script');
  s.src = files[i];
  s.onload = () => load(i + 1);
  s.onerror = () => { document.getElementById('vital').textContent =
    files[i] + ' 을(를) 불러오지 못했다.'; };
  document.body.appendChild(s);
})(0);
</script>
</body>
</html>
